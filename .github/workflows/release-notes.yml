name: Generate Release Note

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (blank = [project].version in pyproject.toml)"
        required: false
        type: string
      previous_tag:
        description: "Tag to compare against (blank = latest published, non-prerelease release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  draft-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Allow only maintainers and admins
        env:
          ACTOR: ${{ github.actor }}
        run: |
          role="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.role_name')"
          case "$role" in
            admin|maintain) echo "${ACTOR} has role '${role}'; continuing." ;;
            *) echo "::error::${ACTOR} has role '${role}'. Only maintain or admin may generate release notes."; exit 1 ;;
          esac

      - name: Allow only the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main (got ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          TARGET_REF: ${{ github.sha }}
        run: .github/scripts/generate-release-notes.sh
