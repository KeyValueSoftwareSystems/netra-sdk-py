name: pre-commit

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Minor version only: an exact patch (like .python-version's 3.12.11) is not built for
      # every runner image, so it breaks whenever `ubuntu-latest` moves to a newer Ubuntu.
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"

      # Same version poetry.lock pins, so CI matches `poetry run pre-commit`.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.2.0

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
